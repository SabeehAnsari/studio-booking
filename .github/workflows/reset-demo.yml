name: Reset live demo

# Restores the public demo to a clean state every night, so one visitor's cancellations
# don't spoil it for the next. Can also be run by hand from the Actions tab.
on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC = 3 AM at the studio (New York)
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "False"
      SECRET_KEY: only-used-to-run-a-management-command-not-a-server
      DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Check the database secret is set
        id: secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DEMO_DATABASE_URL secret not set; nothing to reset."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secret.outputs.present == 'true'
        run: pip install -r requirements.txt
      - if: steps.secret.outputs.present == 'true'
        run: python manage.py migrate --no-input
      - if: steps.secret.outputs.present == 'true'
        run: python manage.py seed_demo
