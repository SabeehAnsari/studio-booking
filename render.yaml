# Render Blueprint: the Django API (web service) and the React frontend (static site).
# The database lives on Neon. Values marked `sync: false` are entered in the Render
# dashboard, never committed.
services:
  - type: web
    name: studio-booking-api
    runtime: python
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DEMO_MODE
        value: "True"
      - key: BUSINESS_TIMEZONE
        value: America/New_York
      # From Neon: the pooled string (host ends in -pooler) for the app, the direct one for migrations.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # The frontend's public URL, e.g. https://studio-booking-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false

  # Static sites are served from Render's CDN and never sleep, unlike the free API.
  - type: web
    name: studio-booking-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      # The API's public URL with no trailing slash, e.g. https://studio-booking-api.onrender.com
      - key: VITE_API_URL
        sync: false
    routes:
      # Single-page app: serve index.html for client-side routes like /book. Real files
      # (JS, CSS, images) are matched first, so they're unaffected.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Built assets have content hashes in their names, so they can be cached forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
