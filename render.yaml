# Render Blueprint: deploys the Django API. The database lives on Neon (DATABASE_URL).
# Values marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: studio-booking-api
    runtime: python
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DEMO_MODE
        value: "True"
      - key: BUSINESS_TIMEZONE
        value: America/New_York
      - key: DATABASE_URL
        sync: false
      # The Vercel URL of the frontend, e.g. https://studio-booking.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
